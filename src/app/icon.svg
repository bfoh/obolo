<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The Batch Column: stock as strata, oldest at the bottom, darkest.
       The app's signature glyph, reused as its mark. -->
  <rect width="64" height="64" fill="#14171a"/>
  <g>
    <rect x="14" y="40" width="36" height="12" fill="#e4e6e1"/>
    <rect x="14" y="27" width="36" height="11" fill="#e4e6e1" opacity="0.68"/>
    <rect x="14" y="17" width="36" height="8" fill="#e4e6e1" opacity="0.4"/>
  </g>
  <!-- Next out of the warehouse, in signal red. -->
  <rect x="10" y="40" width="3" height="12" fill="#e8442a"/>
</svg>
