name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Applies every migration to a throwaway Postgres, twice (to prove
      # idempotency), then exercises the ledger: FIFO ordering, transfer cost
      # fidelity, value-neutrality, oversell refusal, append-only enforcement,
      # reversal, the three-way integrity check, and cost masking per role.
      #
      # This is the gate that matters. A valuation bug is the one failure this
      # app cannot ship, and unit tests cannot catch it -- the logic lives in
      # SQL, so it has to be proven against a real Postgres.
      - name: Verify migrations and ledger behaviour
        run: npm run db:verify
